<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DOUC Business — Boutique</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f7f7f7;

            color: #111;
        }

        header {

            background: #111;

            color: white;

            padding: 18px 20px;

            position: sticky;

            top: 0;

            z-index: 100;
        }

        .header-content {

            max-width: 1200px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }

        .logo {

            font-size: 24px;

            font-weight: 800;
        }

        .logo small {

            display: block;

            font-size: 10px;

            letter-spacing: 3px;

            opacity: .7;
        }

        .search {

            width: 100%;

            max-width: 420px;
        }

        .search input {

            width: 100%;

            padding: 12px 16px;

            border: 0;

            border-radius: 30px;

            outline: none;

            font-size: 15px;
        }

        .hero {

            max-width: 1200px;

            margin: 25px auto;

            padding: 40px 25px;

            background: #111;

            color: white;

            border-radius: 20px;
        }

        .hero h1 {

            font-size: 38px;

            margin-bottom: 10px;
        }

        .hero p {

            opacity: .8;

            font-size: 16px;
        }

        .container {

            max-width: 1200px;

            margin: auto;

            padding: 0 20px 50px;
        }

        .categories {

            display: flex;

            gap: 10px;

            overflow-x: auto;

            padding: 10px 0 25px;
        }

        .category-btn {

            border: 1px solid #ddd;

            background: white;

            padding: 10px 18px;

            border-radius: 30px;

            cursor: pointer;

            white-space: nowrap;
        }

        .category-btn.active {

            background: #111;

            color: white;
        }

        .section-title {

            margin: 10px 0 20px;

            font-size: 25px;
        }

        .products {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(220px, 1fr)
                );

            gap: 20px;
        }

        .product {

            background: white;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 5px 20px rgba(0,0,0,.07);

            transition:
                transform .2s ease;
        }

        .product:hover {

            transform: translateY(-4px);
        }

        .product-image {

            width: 100%;

            height: 230px;

            object-fit: cover;

            background: #eee;
        }

        .product-info {

            padding: 16px;
        }

        .product-category {

            font-size: 12px;

            color: #777;

            margin-bottom: 6px;
        }

        .product-name {

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .description {

            color: #666;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 12px;
        }

        .price {

            font-size: 20px;

            font-weight: 800;

            margin-bottom: 5px;
        }

        .old-price {

            color: #999;

            text-decoration: line-through;

            font-size: 13px;

        }

        .stock {

            margin-top: 10px;

            font-size: 13px;

            color: #555;
        }

        .featured {

            display: inline-block;

            margin-top: 10px;

            padding: 5px 9px;

            border-radius: 20px;

            background: #111;

            color: white;

            font-size: 11px;
        }

        .loading,
        .error,
        .empty {

            text-align: center;

            padding: 50px 20px;

            background: white;

            border-radius: 15px;

            color: #666;
        }

        .error {

            color: #b00020;
        }

        footer {

            background: #111;

            color: white;

            text-align: center;

            padding: 30px 20px;

            margin-top: 30px;
        }

        @media (max-width: 700px) {

            .header-content {

                flex-direction: column;

                align-items: stretch;
            }

            .hero h1 {

                font-size: 30px;
            }

            .products {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }

            .product-image {

                height: 180px;
            }

            .product-info {

                padding: 12px;
            }

            .product-name {

                font-size: 15px;
            }

            .price {

                font-size: 17px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-content">

        <div class="logo">

            DOUC

            <small>BUSINESS 3.0</small>

        </div>


        <div class="search">

            <input
                id="search"
                type="search"
                placeholder="🔎 Rechercher un produit..."
            >

        </div>

    </div>

</header>


<main>


    <section class="hero">

        <h1>
            Bienvenue chez DOUC Business
        </h1>

        <p>
            Découvrez nos produits et profitez
            de nos meilleures offres.
        </p>

    </section>


    <div class="container">


        <div
            id="categories"
            class="categories"
        >

            <button
                class="category-btn active"
                data-category="all"
            >
                Tous
            </button>

        </div>


        <h2 class="section-title">
            Nos produits
        </h2>


        <div
            id="products"
            class="products"
        >

            <div class="loading">
                Chargement des produits...
            </div>

        </div>


    </div>

</main>


<footer>

    <strong>DOUC BUSINESS 3.0</strong>

    <p>
        Votre boutique en ligne
    </p>

</footer>


<script>

const productsContainer =
    document.getElementById("products");

const categoriesContainer =
    document.getElementById("categories");

const searchInput =
    document.getElementById("search");


let allProducts = [];

let selectedCategory = "all";


// =====================================================
// CHARGER PRODUITS
// =====================================================

async function loadProducts() {

    productsContainer.innerHTML = `
        <div class="loading">
            Chargement des produits...
        </div>
    `;

    try {

        const response =
            await fetch("/api/products");

        const result =
            await response.json();


        if (!response.ok || !result.success) {

            throw new Error(
                result.error ||
                "Impossible de charger les produits."
            );

        }


        allProducts =
            result.products || [];


        renderProducts(
            allProducts
        );


    } catch (error) {

        console.error(error);

        productsContainer.innerHTML = `
            <div class="error">

                ❌ Impossible de charger les produits.

                <br><br>

                ${escapeHTML(error.message)}

            </div>
        `;

    }

}


// =====================================================
// CHARGER CATEGORIES
// =====================================================

async function loadCategories() {

    try {

        const response =
            await fetch("/api/categories");

        const result =
            await response.json();


        if (!response.ok || !result.success) {

            throw new Error(
                result.error ||
                "Impossible de charger les catégories."
            );

        }


        const categories =
            result.categories || [];


        categories.forEach(
            category => {

                const button =
                    document.createElement("button");

                button.className =
                    "category-btn";

                button.dataset.category =
                    category.id;

                button.textContent =
                    category.name;


                button.addEventListener(
                    "click",
                    () => {

                        selectedCategory =
                            String(category.id);


                        document
                            .querySelectorAll(
                                ".category-btn"
                            )
                            .forEach(btn => {

                                btn.classList.remove(
                                    "active"
                                );

                            });


                        button.classList.add(
                            "active"
                        );


                        filterProducts();

                    }
                );


                categoriesContainer.appendChild(
                    button
                );

            }
        );


    } catch (error) {

        console.error(
            "Erreur catégories :",
            error
        );

    }

}


// =====================================================
// AFFICHER PRODUITS
// =====================================================

function renderProducts(products) {

    if (!products.length) {

        productsContainer.innerHTML = `
            <div class="empty">
                Aucun produit trouvé.
            </div>
        `;

        return;
    }


    productsContainer.innerHTML = "";


    products.forEach(product => {

        const card =
            document.createElement("article");


        card.className =
            "product";


        const image =
            product.image_url ||
            "https://placehold.co/600x600?text=DOUC";


        const category =
            product.categories?.name ||
            "Autres";


        card.innerHTML = `

            <img
                class="product-image"
                src="${escapeHTML(image)}"
                alt="${escapeHTML(product.name)}"
                loading="lazy"
            >


            <div class="product-info">

                <div class="product-category">
                    ${escapeHTML(category)}
                </div>


                <div class="product-name">
                    ${escapeHTML(product.name)}
                </div>


                ${
                    product.description
                    ? `
                        <div class="description">
                            ${escapeHTML(
                                product.description
                            )}
                        </div>
                    `
                    : ""
                }


                <div class="price">

                    ${formatPrice(product.price)}
                    FCFA

                </div>


                ${
                    product.old_price
                    ? `
                        <div class="old-price">

                            ${formatPrice(
                                product.old_price
                            )}
                            FCFA

                        </div>
                    `
                    : ""
                }


                <div class="stock">

                    ${
                        Number(product.stock || 0) > 0

                        ? `Disponible — Stock :
                           ${Number(product.stock)}`

                        : "Rupture de stock"
                    }

                </div>


                ${
                    product.featured
                    ? `
                        <div class="featured">
                            ⭐ Produit vedette
                        </div>
                    `
                    : ""
                }

            </div>

        `;


        productsContainer.appendChild(
            card
        );

    });

}


// =====================================================
// FILTRER
// =====================================================

function filterProducts() {

    const query =
        searchInput.value
            .toLowerCase()
            .trim();


    const filtered =
        allProducts.filter(product => {

            const name =
                (
                    product.name || ""
                ).toLowerCase();


            const description =
                (
                    product.description || ""
                ).toLowerCase();


            const categoryId =
                String(
                    product.category_id || ""
                );


            const matchesSearch =
                name.includes(query) ||
                description.includes(query);


            const matchesCategory =
                selectedCategory === "all" ||
                categoryId === selectedCategory;


            return (
                matchesSearch &&
                matchesCategory
            );

        });


    renderProducts(
        filtered
    );

}


// =====================================================
// RECHERCHE
// =====================================================

searchInput.addEventListener(
    "input",
    filterProducts
);


// =====================================================
// SECURITE
// =====================================================

function escapeHTML(value) {

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


// =====================================================
// PRIX
// =====================================================

function formatPrice(price) {

    return Number(
        price || 0
    ).toLocaleString(
        "fr-FR"
    );

}


// =====================================================
// DEMARRAGE
// =====================================================

loadCategories();

loadProducts();

</script>


</body>

</html>
