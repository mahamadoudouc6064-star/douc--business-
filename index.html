<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOUC Business 3.0</title>

    <meta
        name="description"
        content="DOUC Business — Votre boutique en ligne moderne."
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f7f9;
            color: #111827;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .topbar {
            max-width: 1200px;
            margin: auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo span {
            display: block;
            font-size: 10px;
            letter-spacing: 3px;
            color: #6b7280;
            margin-top: 2px;
        }

        .cart {
            border: 0;
            background: #111827;
            color: white;
            padding: 11px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .hero {
            max-width: 1200px;
            margin: 25px auto;
            padding: 45px 25px;
            border-radius: 24px;
            background: linear-gradient(
                135deg,
                #111827,
                #374151
            );
            color: white;
        }

        .hero h1 {
            font-size: clamp(32px, 6vw, 58px);
            margin-bottom: 12px;
        }

        .hero p {
            max-width: 650px;
            color: #d1d5db;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px 50px;
        }

        .search-box {
            margin-bottom: 22px;
        }

        .search-box input {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        .search-box input:focus {
            border-color: #111827;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        .category-btn {
            white-space: nowrap;
            border: 1px solid #d1d5db;
            background: white;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
        }

        .category-btn.active {
            background: #111827;
            color: white;
            border-color: #111827;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title h2 {
            font-size: 25px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .product {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            transition: transform .2s, box-shadow .2s;
        }

        .product:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,.08);
        }

        .product-image {
            position: relative;
            aspect-ratio: 1 / 1;
            background: #f3f4f6;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #111827;
            color: white;
            padding: 6px 9px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .product-info {
            padding: 15px;
        }

        .product-info h3 {
            font-size: 17px;
            margin-bottom: 7px;
        }

        .category-name {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .description {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .prices {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 13px;
        }

        .price {
            font-size: 19px;
            font-weight: 900;
        }

        .old-price {
            color: #9ca3af;
            text-decoration: line-through;
            font-size: 13px;
        }

        .stock {
            font-size: 12px;
            color: #16a34a;
            margin-bottom: 12px;
        }

        .out-stock {
            color: #dc2626;
        }

        .buy-btn {
            width: 100%;
            border: 0;
            background: #111827;
            color: white;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .buy-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            background: white;
            border-radius: 18px;
            color: #6b7280;
        }

        .error {
            color: #dc2626;
        }

        footer {
            background: #111827;
            color: white;
            padding: 35px 20px;
            margin-top: 40px;
        }

        .footer-content {
            max-width: 1200px;
            margin: auto;
        }

        .footer-content p {
            color: #9ca3af;
            margin-top: 8px;
        }

        @media (max-width: 950px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .hero {
                margin: 15px;
                padding: 35px 20px;
            }

            .container {
                padding: 0 15px 40px;
            }

            .product-info {
                padding: 12px;
            }

            .product-info h3 {
                font-size: 15px;
            }

            .price {
                font-size: 16px;
            }
        }

        @media (max-width: 420px) {
            .products-grid {
                grid-template-columns: 1fr 1fr;
            }

            .topbar {
                padding: 12px 15px;
            }

            .logo {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="topbar">

        <div class="logo">
            DOUC
            <span>BUSINESS 3.0</span>
        </div>

        <button class="cart">
            🛒 Panier
        </button>

    </div>
</header>

<section class="hero">

    <div class="container">

        <h1>Bienvenue chez DOUC Business</h1>

        <p>
            Découvrez nos produits et trouvez facilement
            ce qu'il vous faut dans notre boutique en ligne.
        </p>

    </div>

</section>

<main class="container">

    <div class="search-box">

        <input
            id="searchInput"
            type="search"
            placeholder="🔎 Rechercher un produit..."
            autocomplete="off"
        >

    </div>

    <div
        id="categories"
        class="categories"
    >
        <button
            class="category-btn active"
            data-category="all"
        >
            Tous
        </button>
    </div>

    <div class="section-title">

        <h2>Nos produits</h2>

        <span id="productCount">
            0 produit
        </span>

    </div>

    <section
        id="productsGrid"
        class="products-grid"
    >

        <div class="loading">
            Chargement des produits...
        </div>

    </section>

</main>

<footer>

    <div class="footer-content">

        <strong>DOUC BUSINESS 3.0</strong>

        <p>
            Votre boutique en ligne.
        </p>

        <p>
            © 2026 DOUC Business — Tous droits réservés.
        </p>

    </div>

</footer>

<script>

    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL =
        "https://xkhavjhoeqtwpmolavdq.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_fYJOpPXAQcQOkVXmuGpoYw_fnt3WqVi";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =====================================================
    // ELEMENTS
    // =====================================================

    const productsGrid =
        document.getElementById("productsGrid");

    const categoriesContainer =
        document.getElementById("categories");

    const searchInput =
        document.getElementById("searchInput");

    const productCount =
        document.getElementById("productCount");


    // =====================================================
    // VARIABLES
    // =====================================================

    let products = [];

    let selectedCategory = "all";

    let searchQuery = "";


    // =====================================================
    // INITIALISATION
    // =====================================================

    document.addEventListener(
        "DOMContentLoaded",
        async function () {

            console.log(
                "DOUC Business 3.0 démarrage..."
            );

            await loadCategories();

            await loadProducts();

        }
    );


    // =====================================================
    // CATEGORIES
    // =====================================================

    async function loadCategories() {

        const {
            data,
            error
        } =
            await supabaseClient

                .from("categories")

                .select(
                    "id,name,is_active"
                )

                .eq(
                    "is_active",
                    true
                )

                .order(
                    "id",
                    {
                        ascending: true
                    }
                );


        if (error) {

            console.error(
                "Erreur catégories :",
                error
            );

            return;
        }


        if (!data) return;


        data.forEach(
            function (category) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "category-btn";


                button.dataset.category =
                    String(category.id);


                button.textContent =
                    category.name;


                button.addEventListener(
                    "click",
                    function () {

                        selectedCategory =
                            String(
                                category.id
                            );


                        document
                            .querySelectorAll(
                                ".category-btn"
                            )
                            .forEach(
                                btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                            );


                        button.classList.add(
                            "active"
                        );


                        renderProducts();

                    }
                );


                categoriesContainer.appendChild(
                    button
                );

            }
        );

    }


    // =====================================================
    // PRODUITS SUPABASE
    // =====================================================

    async function loadProducts() {

        productsGrid.innerHTML = `
            <div class="loading">
                Chargement des produits...
            </div>
        `;


        const {
            data,
            error
        } =
            await supabaseClient

                .from("products")

                .select(`
                    id,
                    name,
                    description,
                    price,
                    old_price,
                    category_id,
                    stock,
                    image_url,
                    featured,
                    is_active,
                    created_at,
                    categories (
                        id,
                        name
                    )
                `)

                .eq(
                    "is_active",
                    true
                )

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(
                "Erreur produits :",
                error
            );


            productsGrid.innerHTML = `
                <div class="error">
                    ❌ Impossible de charger les produits.
                    <br><br>
                    ${escapeHTML(error.message)}
                </div>
            `;

            return;
        }


        products =
            data || [];


        renderProducts();

    }


    // =====================================================
    // AFFICHER PRODUITS
    // =====================================================

    function renderProducts() {

        const filtered =
            products.filter(
                function (product) {

                    const matchesCategory =
                        selectedCategory === "all" ||
                        String(
                            product.category_id
                        ) ===
                        selectedCategory;


                    const name =
                        (
                            product.name ||
                            ""
                        ).toLowerCase();


                    const description =
                        (
                            product.description ||
                            ""
                        ).toLowerCase();


                    const category =
                        (
                            product.categories?.name ||
                            ""
                        ).toLowerCase();


                    const matchesSearch =
                        !searchQuery ||
                        name.includes(
                            searchQuery
                        ) ||
                        description.includes(
                            searchQuery
                        ) ||
                        category.includes(
                            searchQuery
                        );


                    return (
                        matchesCategory &&
                        matchesSearch
                    );

                }
            );


        productCount.textContent =
            filtered.length +
            (
                filtered.length > 1
                    ? " produits"
                    : " produit"
            );


        if (!filtered.length) {

            productsGrid.innerHTML = `
                <div class="empty">
                    Aucun produit trouvé.
                </div>
            `;

            return;
        }


        productsGrid.innerHTML = "";


        filtered.forEach(
            function (product) {

                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "product";


                const image =
                    product.image_url ||
                    "https://placehold.co/600x600?text=DOUC";


                const category =
                    product.categories?.name ||
                    "Autres";


                const stock =
                    Number(
                        product.stock || 0
                    );


                const isOutOfStock =
                    stock <= 0;


                card.innerHTML = `

                    <div class="product-image">

                        <img
                            src="${escapeHTML(image)}"
                            alt="${escapeHTML(product.name)}"
                            loading="lazy"
                        >

                        ${
                            product.featured
                                ? `
                                    <span class="badge">
                                        ⭐ Vedette
                                    </span>
                                `
                                : ""
                        }

                    </div>

                    <div class="product-info">

                        <h3>
                            ${escapeHTML(product.name)}
                        </h3>

                        <div class="category-name">
                            ${escapeHTML(category)}
                        </div>

                        ${
                            product.description
                                ? `
                                    <div class="description">
                                        ${escapeHTML(
                                            product.description
                                        )}
                                    </div>
                                `
                                : ""
                        }

                        <div class="prices">

                            <span class="price">
                                ${formatPrice(product.price)}
                                FCFA
                            </span>

                            ${
                                product.old_price
                                    ? `
                                        <span class="old-price">
                                            ${formatPrice(
                                                product.old_price
                                            )}
                                            FCFA
                                        </span>
                                    `
                                    : ""
                            }

                        </div>

                        <div class="${
                            isOutOfStock
                                ? "stock out-stock"
                                : "stock"
                        }">

                            ${
                                isOutOfStock
                                    ? "❌ Rupture de stock"
                                    : "✅ Stock : " + stock
                            }

                        </div>

                        <button
                            class="buy-btn"
                            ${
                                isOutOfStock
                                    ? "disabled"
                                    : ""
                            }
                            onclick="addToCart(${product.id})"
                        >
                            ${
                                isOutOfStock
                                    ? "Indisponible"
                                    : "🛒 Ajouter au panier"
                            }
                        </button>

                    </div>
                `;


                productsGrid.appendChild(
                    card
                );

            }
        );

    }


    // =====================================================
    // RECHERCHE
    // =====================================================

    searchInput.addEventListener(
        "input",
        function (event) {

            searchQuery =
                event.target.value
                    .toLowerCase()
                    .trim();


            renderProducts();

        }
    );


    // =====================================================
    // PANIER
    // =====================================================

    let cart = [];


    window.addToCart =
        function (id) {

            const product =
                products.find(
                    item =>
                        Number(item.id) ===
                        Number(id)
                );


            if (!product) return;


            const existing =
                cart.find(
                    item =>
                        Number(item.id) ===
                        Number(id)
                );


            if (existing) {

                existing.quantity++;

            } else {

                cart.push({
                    ...product,
                    quantity: 1
                });

            }


            updateCart();


            alert(
                product.name +
                " ajouté au panier ✅"
            );

        };


    function updateCart() {

        const cartButton =
            document.querySelector(
                ".cart"
            );


        const total =
            cart.reduce(
                function (sum, item) {

                    return (
                        sum +
                        Number(
                            item.quantity
                        )
                    );

                },
                0
            );


        cartButton.textContent =
            "🛒 Panier (" +
            total +
            ")";

    }


    document
        .querySelector(".cart")
        .addEventListener(
            "click",
            function () {

                if (!cart.length) {

                    alert(
                        "Votre panier est vide."
                    );

                    return;
                }


                let message =
                    "Votre panier :\n\n";


                let total =
                    0;


                cart.forEach(
                    function (item) {

                        const subtotal =
                            Number(
                                item.price
                            ) *
                            Number(
                                item.quantity
                            );


                        total += subtotal;


                        message +=
                            item.name +
                            " × " +
                            item.quantity +
                            " = " +
                            formatPrice(
                                subtotal
                            ) +
                            " FCFA\n";

                    }
                );


                message +=
                    "\nTotal : " +
                    formatPrice(total) +
                    " FCFA";


                alert(message);

            }
        );


    // =====================================================
    // UTILITAIRES
    // =====================================================

    function formatPrice(price) {

        return Number(
            price || 0
        ).toLocaleString(
            "fr-FR"
        );

    }


    function escapeHTML(value) {

        return String(
            value ?? ""
        )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

    }

</script>

</body>
</html>
