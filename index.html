<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DOUC Business 3.0 — Boutique</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f7f7f7;
            color: #111;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        select {
            font: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #111;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .topbar {
            max-width: 1200px;
            margin: auto;
            padding: 16px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .logo span {
            display: block;
            font-size: 10px;
            letter-spacing: 3px;
            opacity: .7;
        }

        .cart {
            background: white;
            color: #111;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            background: linear-gradient(
                135deg,
                #111,
                #333
            );

            color: white;

            padding: 70px 20px;
            text-align: center;
        }

        .hero-content {
            max-width: 900px;
            margin: auto;
        }

        .hero h1 {
            font-size: clamp(35px, 7vw, 65px);
            margin-bottom: 15px;
        }

        .hero p {
            color: #ddd;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .hero-btn {
            display: inline-block;
            background: white;
            color: #111;
            padding: 13px 25px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-box {
            margin-bottom: 30px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
            outline: none;
        }

        .search-box input:focus {
            border-color: #111;
        }

        /* =========================
           CATEGORIES
        ========================= */

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 35px;
        }

        .category-btn {
            white-space: nowrap;
            border: 1px solid #ddd;
            background: white;
            padding: 10px 17px;
            border-radius: 30px;
            cursor: pointer;
        }

        .category-btn.active {
            background: #111;
            color: white;
            border-color: #111;
        }

        /* =========================
           TITLE
        ========================= */

        .section-title {
            margin-bottom: 25px;
        }

        .section-title h2 {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .section-title p {
            color: #777;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products-grid {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;

            border: 1px solid #eee;

            transition:
                transform .2s,
                box-shadow .2s;
        }

        .product-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 12px 35px
                rgba(0,0,0,.09);
        }

        .product-image-container {
            position: relative;
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            background: #eee;
        }

        .featured-badge {
            position: absolute;
            top: 12px;
            left: 12px;

            background: #111;
            color: white;

            padding: 6px 10px;
            border-radius: 20px;

            font-size: 12px;
            font-weight: 700;
        }

        .product-info {
            padding: 16px;
        }

        .product-category {
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .product-name {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .product-description {
            color: #777;
            font-size: 14px;
            line-height: 1.4;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;

            margin-bottom: 12px;
        }

        .prices {
            margin-bottom: 8px;
        }

        .price {
            font-size: 20px;
            font-weight: 900;
        }

        .old-price {
            color: #999;
            text-decoration: line-through;
            font-size: 13px;
            margin-left: 7px;
        }

        .stock {
            font-size: 13px;
            margin-bottom: 12px;
        }

        .available {
            color: #16803c;
        }

        .unavailable {
            color: #c62828;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .product-button {
            flex: 1;

            border: none;
            background: #111;
            color: white;

            padding: 12px 8px;

            border-radius: 9px;

            cursor: pointer;
            font-weight: 700;
        }

        .product-button:hover {
            opacity: .85;
        }

        /* =========================
           LOADING
        ========================= */

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;

            text-align: center;

            background: white;

            padding: 50px 20px;

            border-radius: 15px;

            color: #777;
        }

        .error {
            color: #c62828;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #111;
            color: white;

            margin-top: 60px;

            padding: 40px 20px;

            text-align: center;
        }

        footer p {
            color: #aaa;
            margin-top: 8px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {

            .products-grid {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }

        @media (max-width: 700px) {

            .topbar {
                padding: 13px 15px;
            }

            .hero {
                padding: 50px 20px;
            }

            .products-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;
            }

            .product-image {
                height: 190px;
            }

            .product-info {
                padding: 11px;
            }

            .product-name {
                font-size: 15px;
            }

            .product-description {
                font-size: 12px;
            }

            .price {
                font-size: 16px;
            }

            .product-button {
                font-size: 12px;
                padding: 10px 5px;
            }

        }

        @media (max-width: 400px) {

            .products-grid {
                gap: 8px;
            }

            .product-image {
                height: 160px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="topbar">

        <div class="logo">
            DOUC
            <span>BUSINESS 3.0</span>
        </div>

        <button
            class="cart"
            onclick="showCart()"
        >
            🛒 Panier
            <span id="cartCount">0</span>
        </button>

    </div>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <div class="hero-content">

        <h1>
            DOUC Business
        </h1>

        <p>
            Découvrez nos produits
            et faites vos achats simplement.
        </p>

        <a
            href="#products"
            class="hero-btn"
        >
            Découvrir les produits
        </a>

    </div>

</section>


<!-- =========================
     BOUTIQUE
========================= -->

<main
    class="container"
    id="products"
>


    <!-- RECHERCHE -->

    <div class="search-box">

        <input
            id="searchInput"
            type="search"
            placeholder="🔎 Rechercher un produit..."
        >

    </div>


    <!-- CATEGORIES -->

    <div
        id="categories"
        class="categories"
    >

        <button
            class="category-btn active"
            data-category="all"
        >
            Tous
        </button>

    </div>


    <!-- TITRE -->

    <div class="section-title">

        <h2>
            Nos produits
        </h2>

        <p>
            Les produits disponibles
            chez DOUC Business.
        </p>

    </div>


    <!-- PRODUITS -->

    <div
        id="productsGrid"
        class="products-grid"
    >

        <div class="loading">
            Chargement des produits...
        </div>

    </div>


</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <strong>
        DOUC BUSINESS 3.0
    </strong>

    <p>
        Votre boutique en ligne.
    </p>

</footer>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

const SUPABASE_URL =
    "https://xkhavjhoeqtwpmolavdq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_fYJOpPXAQcQOkVXmuGpoYw_fnt3WqVi";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allProducts = [];

let currentCategory = "all";

let cart = [];


/* =========================
   INITIALISATION
========================= */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        await loadCategories();

        await loadProducts();

        setupSearch();

    }
);


/* =========================
   CATEGORIES
========================= */

async function loadCategories() {

    const container =
        document.getElementById(
            "categories"
        );


    const {
        data,
        error
    } =
        await supabaseClient

            .from("categories")

            .select(
                "id,name"
            )

            .eq(
                "is_active",
                true
            )

            .order(
                "id",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Erreur catégories :",
            error
        );

        return;
    }


    data.forEach(
        category => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "category-btn";


            button.dataset.category =
                category.id;


            button.textContent =
                category.name;


            button.addEventListener(
                "click",
                function () {

                    currentCategory =
                        String(
                            category.id
                        );


                    document
                        .querySelectorAll(
                            ".category-btn"
                        )
                        .forEach(
                            btn =>
                                btn.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    button.classList.add(
                        "active"
                    );


                    filterProducts();

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =========================
   PRODUITS
========================= */

async function loadProducts() {

    const grid =
        document.getElementById(
            "productsGrid"
        );


    grid.innerHTML = `
        <div class="loading">
            Chargement des produits...
        </div>
    `;


    const {
        data,
        error
    } =
        await supabaseClient

            .from("products")

            .select(`
                id,
                name,
                description,
                price,
                old_price,
                stock,
                image_url,
                featured,
                is_active,
                category_id,
                created_at,
                categories (
                    id,
                    name
                )
            `)

            .eq(
                "is_active",
                true
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "ERREUR PRODUITS :",
            error
        );


        grid.innerHTML = `
            <div class="error">
                ❌ Impossible de charger
                les produits.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

        return;
    }


    allProducts =
        data || [];


    filterProducts();

}


/* =========================
   AFFICHER PRODUITS
========================= */

function renderProducts(
    products
) {

    const grid =
        document.getElementById(
            "productsGrid"
        );


    if (
        !products ||
        products.length === 0
    ) {

        grid.innerHTML = `
            <div class="empty">
                Aucun produit disponible.
            </div>
        `;

        return;
    }


    grid.innerHTML = "";


    products.forEach(
        product => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "product-card";


            const image =
                product.image_url ||
                "https://placehold.co/600x600?text=DOUC";


            const category =
                product.categories?.name ||
                "Autres";


            const price =
                Number(
                    product.price || 0
                ).toLocaleString(
                    "fr-FR"
                );


            const oldPrice =
                product.old_price
                    ? Number(
                        product.old_price
                    ).toLocaleString(
                        "fr-FR"
                    )
                    : null;


            const stock =
                Number(
                    product.stock || 0
                );


            card.innerHTML = `

                <div
                    class="product-image-container"
                >

                    <img
                        class="product-image"
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(product.name)}"
                        loading="lazy"
                    >

                    ${
                        product.featured
                            ? `
                                <div
                                    class="featured-badge"
                                >
                                    ⭐ Vedette
                                </div>
                            `
                            : ""
                    }

                </div>


                <div
                    class="product-info"
                >

                    <div
                        class="product-category"
                    >
                        ${escapeHTML(category)}
                    </div>


                    <h3
                        class="product-name"
                    >
                        ${escapeHTML(product.name)}
                    </h3>


                    <div
                        class="product-description"
                    >
                        ${
                            escapeHTML(
                                product.description ||
                                "Produit DOUC Business."
                            )
                        }
                    </div>


                    <div
                        class="prices"
                    >

                        <span
                            class="price"
                        >
                            ${price} FCFA
                        </span>

                        ${
                            oldPrice
                                ? `
                                    <span
                                        class="old-price"
                                    >
                                        ${oldPrice} FCFA
                                    </span>
                                `
                                : ""
                        }

                    </div>


                    <div
                        class="stock ${
                            stock > 0
                                ? "available"
                                : "unavailable"
                        }"
                    >

                        ${
                            stock > 0
                                ? `✅ ${stock} disponible(s)`
                                : "❌ Rupture de stock"
                        }

                    </div>


                    <div
                        class="product-actions"
                    >

                        <button
                            class="product-button"
                            onclick="addToCart(${product.id})"
                            ${
                                stock <= 0
                                    ? "disabled"
                                    : ""
                            }
                        >
                            🛒 Ajouter
                        </button>

                    </div>

                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =========================
   FILTRAGE
========================= */

function filterProducts() {

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const filtered =
        allProducts.filter(
            product => {

                const matchesCategory =
                    currentCategory === "all" ||
                    String(
                        product.category_id
                    ) === currentCategory;


                const matchesSearch =
                    !search ||
                    (
                        product.name ||
                        ""
                    )
                    .toLowerCase()
                    .includes(search)
                    ||
                    (
                        product.description ||
                        ""
                    )
                    .toLowerCase()
                    .includes(search);


                return (
                    matchesCategory &&
                    matchesSearch
                );

            }
        );


    renderProducts(
        filtered
    );

}


/* =========================
   RECHERCHE
========================= */

function setupSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );


    input.addEventListener(
        "input",
        filterProducts
    );


    document
        .querySelector(
            '[data-category="all"]'
        )
        .addEventListener(
            "click",
            function () {

                currentCategory =
                    "all";


                document
                    .querySelectorAll(
                        ".category-btn"
                    )
                    .forEach(
                        btn =>
                            btn.classList
                                .remove(
                                    "active"
                                )
                    );


                this.classList.add(
                    "active"
                );


                filterProducts();

            }
        );

}


/* =========================
   PANIER
========================= */

function addToCart(
    productId
) {

    const product =
        allProducts.find(
            item =>
                Number(item.id) ===
                Number(productId)
        );


    if (!product) {

        return;
    }


    if (
        Number(product.stock || 0) <= 0
    ) {

        alert(
            "Ce produit est en rupture de stock."
        );

        return;
    }


    cart.push(
        product
    );


    updateCartCount();


    alert(
        product.name +
        " ajouté au panier ✅"
    );

}


/* =========================
   COMPTEUR PANIER
========================= */

function updateCartCount() {

    document.getElementById(
        "cartCount"
    ).textContent =
        cart.length;

}


/* =========================
   PANIER
========================= */

function showCart() {

    if (cart.length === 0) {

        alert(
            "Votre panier est vide."
        );

        return;
    }


    const names =
        cart
            .map(
                product =>
                    "• " +
                    product.name
            )
            .join(
                "\n"
            );


    alert(
        "Votre panier :\n\n" +
        names
    );

}


/* =========================
   SECURITE
========================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

</script>


</body>

</html>
