<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOUC Business 3.0 — Administration</title>

    <link rel="stylesheet" href="admin.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <span>DOUC</span>
        <small>BUSINESS 3.0</small>
    </div>

    <div class="admin-title">
        Tableau de bord
    </div>

</header>


<main class="dashboard">

    <!-- STATISTIQUES -->

    <section class="stats">

        <div class="stat-card">
            <span>Produits</span>
            <strong id="totalProducts">0</strong>
        </div>

        <div class="stat-card">
            <span>Stock</span>
            <strong id="totalStock">0</strong>
        </div>

        <div class="stat-card">
            <span>Vedettes</span>
            <strong id="totalFeatured">0</strong>
        </div>

        <div class="stat-card">
            <span>Commandes</span>
            <strong id="totalOrders">0</strong>
        </div>

    </section>


    <!-- FORMULAIRE -->

    <section class="panel">

        <div class="panel-header">

            <div>
                <h2 id="formTitle">
                    Ajouter un produit
                </h2>

                <p>
                    Gérez les produits de votre boutique.
                </p>
            </div>

        </div>


        <form id="productForm">

            <input type="hidden" id="productId">


            <div class="form-grid">

                <div class="field">

                    <label>
                        Nom du produit
                    </label>

                    <input
                        id="productName"
                        type="text"
                        placeholder="Ex : T-shirt Premium"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Catégorie
                    </label>

                    <select id="productCategory">

                        <option value="">
                            Sélectionner
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label>
                        Prix (FCFA)
                    </label>

                    <input
                        id="productPrice"
                        type="number"
                        min="0"
                        placeholder="15000"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Ancien prix (FCFA)
                    </label>

                    <input
                        id="productOldPrice"
                        type="number"
                        min="0"
                        placeholder="20000"
                    >

                </div>


                <div class="field">

                    <label>
                        Stock
                    </label>

                    <input
                        id="productStock"
                        type="number"
                        min="0"
                        value="0"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Image URL
                    </label>

                    <input
                        id="productImage"
                        type="url"
                        placeholder="https://..."
                    >

                </div>

            </div>


            <div class="field">

                <label>
                    Description
                </label>

                <textarea
                    id="productDescription"
                    placeholder="Description du produit..."
                ></textarea>

            </div>


            <div class="options">

                <label>
                    <input
                        type="checkbox"
                        id="productFeatured"
                    >

                    Produit vedette ⭐
                </label>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="primary-btn"
                >
                    💾 Enregistrer
                </button>

                <button
                    type="button"
                    id="cancelEdit"
                    class="secondary-btn hidden"
                >
                    Annuler
                </button>

            </div>

        </form>

    </section>


    <!-- PRODUITS -->

    <section class="panel">

        <div class="panel-header products-header">

            <div>

                <h2>
                    Produits
                </h2>

                <p>
                    Tous les produits de votre boutique.
                </p>

            </div>


            <input
                id="searchProducts"
                type="search"
                placeholder="🔎 Rechercher..."
            >

        </div>


        <div
            id="productsList"
            class="products-list"
        >

            <div class="loading">
                Chargement...
            </div>

        </div>

    </section>

</main>


<div
    id="toast"
    class="toast"
></div>


<script src="admin.js"></script>

</body>
</html>
